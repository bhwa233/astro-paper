name: "Commit and push archive output"
description: "Stages the given paths, commits them, and pushes with retries around concurrent pushes to the same branch."

# 归档任务彼此并发，推同一个分支会互相打败。重试次数和退避写在这里，不再散落在
# 每个 workflow 的内联脚本里。
#
# 不覆盖 blog-publish.yml 的 "Commit generated content" / "Push generated content"：
# 那边提交与推送之间夹着一次构建，并且在产物路径缺失时要以失败告终，语义和这里不同。
inputs:
  paths:
    description: "Space-separated repository paths to stage. Paths that do not exist are skipped."
    required: true
  message:
    description: "Commit message."
    required: true

runs:
  using: composite
  steps:
    - name: "Commit and push"
      shell: bash
      env:
        ARCHIVE_PATHS: ${{ inputs.paths }}
        ARCHIVE_MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        read -ra requested <<< "$ARCHIVE_PATHS"
        existing=()
        for candidate in "${requested[@]}"; do
          if [ -e "$candidate" ]; then existing+=("$candidate"); fi
        done
        if [ ${#existing[@]} -eq 0 ]; then
          echo "none of the requested paths exist; nothing to commit"
          exit 0
        fi
        if [ -z "$(git status --porcelain -- "${existing[@]}")" ]; then
          echo "no changes under: ${existing[*]}"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- "${existing[@]}"
        git commit -m "$ARCHIVE_MESSAGE"
        for attempt in 1 2 3; do
          git pull --rebase origin "${GITHUB_REF_NAME}"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          echo "push attempt ${attempt}/3 failed; retrying after remote refresh" >&2
          sleep $((attempt * 5))
        done
        echo "failed to push after 3 attempts" >&2
        exit 1
