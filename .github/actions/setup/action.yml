name: "Set up Node and pnpm"
description: "Installs pnpm, Node.js and the locked dependency tree."

# 这三步在仓库里出现过十一次。版本收在这里，升级 Node 或 pnpm 只改这一个文件。
inputs:
  pnpm-version:
    description: "pnpm release to install."
    required: false
    default: "11.3.0"
  node-version:
    description: "Node.js major version to install."
    required: false
    default: "24"
  # 仓库是 pnpm workspace（根包 + video）。不给 filter 的话 `pnpm install` 会把
  # 每个工作区包都装上，二十多个跟视频无关的定时任务都要多下 Remotion 那一套。
  # 默认只装根包，保持加 video/ 之前的行为；渲染视频的 workflow 显式改这个值。
  filter:
    description: "pnpm --filter selector for the install. Default installs only the root package."
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: "Install pnpm"
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: "Use Node.js"
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: "Install dependencies"
      shell: bash
      env:
        INSTALL_FILTER: ${{ inputs.filter }}
      run: pnpm install --frozen-lockfile --filter "$INSTALL_FILTER"
