name: Blog Generation Contracts

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    paths:
      # 按目录整体匹配。逐个点名 workflow 文件时，二十多个 publish-*.yml 里只列到了
      # 两个，改其余任何一个都绕过了这道门。
      - ".github/actions/**"
      - ".github/workflows/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/content.config.ts"
      - "src/utils/**"
      - "prompts/blog/**"
      - "scripts/**"
      - "tests/**"
      # 渲染契约住在 video/，脚本和测试都 import 它。漏掉这条时，一个只改
      # video/src/contract.ts 的改动跳过了整道门，红了八天才被定时任务撞出来。
      - "video/**"
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    name: Validate blog generation pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Set up Node and pnpm"
        uses: ./.github/actions/setup

      # check:conventions 不在这里跑：Site Quality Gate 的 `pnpm run lint` 已经包含它，
      # 而那个工作流没有 paths 过滤，每个 PR 都会跑到。
      - name: "Type-check generation scripts"
        run: pnpm run typecheck

      - name: "Run blog pipeline tests"
        run: pnpm run test:blog

      - name: "Run WeChat sync tests"
        run: pnpm run test:wechat
