name: Blog Generation Contracts

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    paths:
      - ".github/workflows/blog-generation-ci.yml"
      - ".github/workflows/publish-substack-translations.yml"
      - ".github/workflows/scheduled-posts.yml"
      - "docs/blog-cron-*.md"
      - "docs/hn-cron-pipeline.md"
      - "docs/substack-translation-pipeline.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/content.config.ts"
      - "prompts/blog/**"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    name: Validate blog generation pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Install pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Verify generated content quality"
        run: pnpm run check:conventions

      - name: "Type-check generation scripts"
        run: pnpm run typecheck
