name: Blog Publish

permissions:
  contents: write

on:
  workflow_call:
    outputs:
      generated_sha:
        description: "The commit containing the generated archive."
        value: ${{ jobs.generate.outputs.generated_sha }}
    inputs:
      task:
        description: "Post task to generate. Valid values are defined in scripts/blog_tasks.ts; use all or daily-digests for grouped runs."
        type: string
        required: true
      date:
        description: "Archive date in Asia/Shanghai, YYYY-MM-DD. Empty = today or scheduled offset."
        required: false
        type: string
      event_schedule:
        description: "Original cron string, used only to preserve scheduled task date mapping."
        required: false
        type: string
      reddit_category:
        description: "Reddit category key required by reddit-top20: life, ama, or markets."
        required: false
        type: string
      force:
        description: "Overwrite an existing post for the same date"
        required: false
        type: boolean
        default: false
      ai_model:
        description: "Optional AI model override. Empty = gemini-3.7-flash."
        required: false
        type: string
      podcast_max_episodes:
        description: "Final daily-podcasts safety cap after merging Apple Top 5 + 5 foreign tech episodes. Empty = 10."
        required: false
        type: string
        default: "10"
      install_ffmpeg:
        description: "Install ffmpeg and certificates before generation."
        required: false
        type: boolean
        default: false
      sync_wechat:
        description: "Synchronize a generated technical daily to the WeChat draft box."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      task:
        description: "Post task to generate. Valid values are defined in scripts/blog_tasks.ts; use all or daily-digests for grouped runs."
        type: string
        required: true
        default: hn-top10
      date:
        description: "Archive date in Asia/Shanghai, YYYY-MM-DD. Empty = today or scheduled offset."
        required: false
        type: string
      event_schedule:
        description: "Optional cron string to reuse scheduled date mapping."
        required: false
        type: string
      reddit_category:
        description: "Reddit category key required by reddit-top20: life, ama, or markets."
        required: false
        type: string
      force:
        description: "Overwrite an existing post for the same date"
        required: false
        type: boolean
        default: false
      ai_model:
        description: "Optional AI model override. Empty = gemini-3.7-flash."
        required: false
        type: string
      podcast_max_episodes:
        description: "Final daily-podcasts safety cap after merging Apple Top 5 + 5 foreign tech episodes. Empty = 10."
        required: false
        type: string
        default: "10"
      install_ffmpeg:
        description: "Install ffmpeg and certificates before generation."
        required: false
        type: boolean
        default: false
      sync_wechat:
        description: "Synchronize a generated technical daily to the WeChat draft box."
        required: false
        type: boolean
        default: false

concurrency:
  group: scheduled-posts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Publish scheduled blog posts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # 产物目录清单，检测与提交共用；其中部分目录只在对应任务运行时才被创建。
    env:
      PUBLISH_PATHS: "src/content/posts data public/images/podcast public/images/magazine"
    outputs:
      generated_sha: ${{ steps.head.outputs.sha }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Sync to latest branch head"
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

      - name: "Install pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile

      # 日粒度的 key：这个仓库每天发布十几次，每次存一份 100MB+ 会很快吃满
      # 仓库 10GB 的缓存额度。命中当天已存在的 key 就不再保存，当天后续构建
      # 复用早上那份，只多渲染当天新增的几篇。
      - name: "Resolve build cache day"
        id: cache-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # 增量构建的全部状态都在 cacheDir 里：上一轮的页面产出、content
      # data store、下载好的字体，以及 OG PNG。不还原它，
      # experimental.incrementalBuild 每次都从零重渲染。
      - name: "Restore Astro build cache"
        uses: actions/cache@v5
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'astro.config.ts', 'astro-paper.config.ts') }}-${{ steps.cache-day.outputs.day }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'astro.config.ts', 'astro-paper.config.ts') }}-

      - name: "Install ffmpeg for podcast transcription"
        if: ${{ inputs.install_ffmpeg || inputs.task == 'daily-podcasts' || inputs.task == 'xyzrank-top-episodes' || inputs.task == 'all' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg ca-certificates

      - name: "Generate scheduled content"
        env:
          INPUT_TASK: ${{ inputs.task || '' }}
          INPUT_DATE: ${{ inputs.date || '' }}
          INPUT_FORCE: ${{ inputs.force || 'false' }}
          INPUT_REDDIT_CATEGORY: ${{ inputs.reddit_category || '' }}
          EVENT_SCHEDULE: ${{ inputs.event_schedule || '' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://rightapi.ai/gemini
          AI_MODEL: ${{ inputs.ai_model || 'gemini-3.7-flash' }}
          AI_API_STYLE: gemini
          AI_FALLBACK_ENABLED: "true"
          AI_FALLBACK_API_KEY: ${{ secrets.AI_FALLBACK_API_KEY || secrets.AI_API_KEY }}
          AI_FALLBACK_BASE_URL: https://rightapi.ai/codex/v1
          AI_FALLBACK_MODEL: gpt-5.6-luna
          AI_FALLBACK_API_STYLE: chat
          REDDIT_SOURCE_POLL_TIMEOUT_MS: "1500000"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          REDDIT_SOURCE_API_URL: ${{ secrets.REDDIT_SOURCE_API_URL }}
          REDDIT_SOURCE_API_TOKEN: ${{ secrets.REDDIT_SOURCE_API_TOKEN }}
          WEIBO_SOURCE_API_URL: ${{ secrets.REDDIT_SOURCE_API_URL }}
          WEIBO_SOURCE_API_TOKEN: ${{ secrets.REDDIT_SOURCE_API_TOKEN }}
          REDDIT_AI_CONCURRENCY: 3
          GITHUB_TOKEN: ${{ github.token }}
          PODCAST_TRANSCRIBE_PROVIDER: gemini
          PODCAST_GEMINI_MODEL: gemini-flash-latest
          PODCAST_GEMINI_ARTICLE_BASE_URL: https://right.codes/gemini
          PODCAST_GEMINI_ARTICLE_MODEL: gemini-3.5-flash
          PODCAST_GEMINI_ARTICLE_API_KEY: ${{ secrets.PODCAST_GEMINI_ARTICLE_API_KEY }}
          PODCAST_GEMINI_SEGMENT_SECONDS: 1200
          PODCAST_GEMINI_MAX_INLINE_CHUNK_MB: 14
          PODCAST_GEMINI_ARTICLE_AUDIO_SPEED: "1.5"
          PODCAST_GEMINI_ARTICLE_AUDIO_BITRATE: 24k
          PODCAST_GEMINI_ARTICLE_AUDIO_CODEC: libopus
          PODCAST_GEMINI_TIMEOUT_MS: 600000
          AI_TIMEOUT_MS: 600000
          PODCAST_PROMPT_TRANSCRIPT_CHARS: 8000
          PODCAST_AUDIO_DOWNLOAD_TIMEOUT_MS: 120000
          PODCAST_MAX_EPISODES: ${{ inputs.podcast_max_episodes || '10' }}
          PODCAST_MIN_EPISODES: 1
          PODCAST_CANDIDATE_EPISODES: 999
          FOREIGN_TECH_PODCAST_MAX_EPISODES: 999
          APPLE_TOP_PODCASTS_COUNT: 20
          APPLE_TOP_PODCASTS_MAX_EPISODES: 999
          APPLE_TOP_PODCASTS_TRANSCRIBE_DELAY_MS: 15000
          PODCAST_FFMPEG_TIMEOUT_MS: 300000
          PODCAST_DAILY_MAX_EPISODE_MINUTES: 180
          XYZRANK_TOP_EPISODES_LIMIT: 5
        run: |
          set -euo pipefail
          args=(--ai --artifacts-dir blog-generation-artifacts)
          if [ -n "$INPUT_TASK" ]; then
            args+=(--task "$INPUT_TASK")
          fi
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi
          if [ -n "$INPUT_REDDIT_CATEGORY" ]; then
            args+=(--reddit-category "$INPUT_REDDIT_CATEGORY")
          fi
          if [ -n "$AI_MODEL" ]; then
            args+=(--model "$AI_MODEL")
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            args+=(--force)
          fi
          node --import tsx scripts/generate_scheduled_post.ts "${args[@]}" --result-json scheduled-posts-result.json
          cat scheduled-posts-result.json

      - name: "Upload generation artifacts"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-posts-generation-artifacts
          path: |
            scheduled-posts-result.json
            blog-generation-artifacts/
          if-no-files-found: ignore

      - name: "Summarize scheduled publishing result"
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f scheduled-posts-result.json ]; then
            echo "### Scheduled blog publishing" >> "$GITHUB_STEP_SUMMARY"
            echo "scheduled-posts-result.json was not produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync("scheduled-posts-result.json", "utf8"));
          const lines = ["### Scheduled blog publishing", "", `Archive date: ${payload.date || "unknown"}`, "", "| Task | Status | Path | Detail |", "| --- | --- | --- | --- |"];
          for (const item of payload.results || []) {
            const status = item.failed ? "failed" : item.skipped ? "skipped" : item.created ? "created" : "updated";
            const detail = String(item.error || item.skip_reason || item.title || "")
              .replaceAll("|", "\\|")
              .replaceAll("\r", " ")
              .replaceAll("\n", " ");
            lines.push(`| ${item.task || "unknown"} | ${status} | ${item.path || "-"} | ${detail} |`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE

      - name: "Verify generated content contract"
        env:
          PODCAST_MIN_EPISODES: 1
        run: node --import tsx scripts/verify_blog_generation.ts --result-json scheduled-posts-result.json

      - name: "Format generated content"
        run: pnpm exec prettier --write "src/content/posts/zh-cn/*.md"

      - name: "Detect publishable changes"
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- $PUBLISH_PATHS)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git status --short

      - name: "Build site with generated content"
        run: pnpm run build

      - name: "Commit and push generated content"
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 缺失路径会让 git add 以 128 退出，所以只提交这次运行里真实存在的产物目录。
          staged=""
          for candidate in $PUBLISH_PATHS; do
            if [ -e "$candidate" ]; then
              staged="$staged $candidate"
            fi
          done
          if [ -z "$staged" ]; then
            echo "no generated paths exist to commit" >&2
            exit 1
          fi
          git add -- $staged
          git commit -m "feat(posts): archive scheduled posts"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt ${attempt}/3 failed; retrying after remote refresh"
            sleep $((attempt * 5))
          done
          echo "failed to push generated posts after 3 attempts" >&2
          exit 1

      - name: "Record generated revision"
        id: head
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Report task-level generation failures"
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f scheduled-posts-result.json ]; then
            echo "scheduled-posts-result.json was not produced"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync("scheduled-posts-result.json", "utf8"));
          const failures = (payload.results || []).filter((item) => item.failed);
          if (!failures.length) {
            console.log("No task-level generation failures.");
            process.exit(0);
          }
          console.error("Task-level generation failures:");
          for (const item of failures) console.error(`- ${item.task}: ${item.error}`);
          process.exit(1);
          NODE

  sync-wechat:
    name: Sync selected article to WeChat
    needs: generate
    if: ${{ needs.generate.result == 'success' && (inputs.task == 'tech-daily' || inputs.task == 'nyt-books-weekly') && inputs.sync_wechat }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: wechat-production
    concurrency:
      group: wechat-sync-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: "Checkout generated revision"
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate.outputs.generated_sha }}
          fetch-depth: 0

      - name: "Download generation result"
        uses: actions/download-artifact@v8
        with:
          name: scheduled-posts-generation-artifacts
          path: scheduled-posts-generation-artifacts

      - name: "Install pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Select generated WeChat article"
        id: source
        env:
          WECHAT_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const resultPath = "scheduled-posts-generation-artifacts/scheduled-posts-result.json";
          const payload = JSON.parse(fs.readFileSync(resultPath, "utf8"));
          const item = (payload.results || []).find(result => result.task === process.env.WECHAT_TASK);
          const output = process.env.GITHUB_OUTPUT;
          if (!item || item.failed || !item.path || /[\0\r\n]/.test(item.path)) {
            fs.appendFileSync(output, "path=\n");
            console.log("No publishable WeChat article was generated.");
            process.exit(0);
          }
          fs.appendFileSync(output, `path=${item.path}\n`);
          NODE

      - name: "Dry-run WeChat synchronization"
        id: dry-run
        if: steps.source.outputs.path != ''
        env:
          ARTICLE_PATH: ${{ steps.source.outputs.path }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
          WECHAT_PROXY_TOKEN: ${{ secrets.WECHAT_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec astro-wechat publish "$ARTICLE_PATH" --dry-run --json | tee wechat-dry-run.json

      - name: "Approve planned draft creation"
        id: decision
        if: steps.source.outputs.path != ''
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const results = JSON.parse(fs.readFileSync("wechat-dry-run.json", "utf8"));
          if (!Array.isArray(results) || results.length !== 1) {
            throw new Error("WeChat dry-run must return exactly one result.");
          }
          const [result] = results;
          if (result.status === "planned") {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=true\n");
          } else if (result.status === "skipped") {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=false\n");
          } else {
            throw new Error(`WeChat dry-run did not produce a publishable result: ${result.errorMessage || result.status}`);
          }
          NODE

      - name: "Create WeChat draft"
        if: steps.decision.outputs.publish == 'true'
        env:
          ARTICLE_PATH: ${{ steps.source.outputs.path }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
          WECHAT_PROXY_TOKEN: ${{ secrets.WECHAT_PROXY_TOKEN }}
        run: pnpm exec astro-wechat publish "$ARTICLE_PATH" --json | tee wechat-results.json

      - name: "Commit WeChat ledger"
        if: always() && steps.decision.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- .astro-wechat/ledger.json)" ]; then
            echo "WeChat ledger is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .astro-wechat/ledger.json
          git commit -m "chore: update WeChat sync ledger [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt ${attempt}/3 failed; retrying after remote refresh"
            sleep $((attempt * 5))
          done
          echo "failed to push WeChat ledger after 3 attempts" >&2
          exit 1

      - name: "Upload WeChat synchronization results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wechat-sync-results
          path: |
            wechat-dry-run.json
            wechat-results.json
          if-no-files-found: ignore
