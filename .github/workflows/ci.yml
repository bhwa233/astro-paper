name: Site Quality Gate

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Lint, format, and build site
    runs-on: ubuntu-latest
    # The site build grows with the post archive; at 3 minutes this job was already
    # finishing at ~2m30 and was cancelled once with every step green. Keep headroom.
    timeout-minutes: 8

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Install pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Resolve build cache day"
        id: cache-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # 与发布流水线同一套 key：PR 构建能直接吃到 main 上当天已经预热好的缓存。
      - name: "Restore Astro build cache"
        uses: actions/cache/restore@v5
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'astro.config.ts', 'astro-paper.config.ts') }}-${{ steps.cache-day.outputs.day }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'astro.config.ts', 'astro-paper.config.ts') }}-

      - name: "Lint source"
        run: pnpm run lint

      - name: "Check formatting"
        run: pnpm run format:check

      - name: "Build site"
        run: pnpm run build
