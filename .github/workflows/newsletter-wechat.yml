name: Sync Newsletter WeChat Drafts

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      upstream_sha:
        description: "Committed revision containing the generated newsletter articles."
        required: true
        type: string
      upstream_workflow_run:
        description: "Workflow run that produced the newsletter result artifact."
        required: true
        type: string

jobs:
  sync-wechat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: wechat-production
    concurrency:
      group: wechat-sync-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout generated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.upstream_sha }}
          fetch-depth: 0

      - name: Prepare writable ledger branch
        env:
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: git checkout -B "${GITHUB_REF_NAME}" "$UPSTREAM_SHA"

      - name: Download newsletter generation result
        uses: actions/download-artifact@v8
        with:
          name: substack-translation-generation
          path: newsletter-generation

      - uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Collect opted-in newsletter paths
        id: paths
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const resultPath = "newsletter-generation/substack-translation-result.json";
          const payload = JSON.parse(fs.readFileSync(resultPath, "utf8"));
          const paths = (payload.results || [])
            .filter(item => item.status === "published" && item.wechat?.enabled === true && item.postPath)
            .map(item => item.postPath);
          if (new Set(paths).size !== paths.length) throw new Error("Newsletter result contains duplicate WeChat article paths");
          for (const articlePath of paths) {
            if (typeof articlePath !== "string" || /[\0\r\n]/.test(articlePath)) throw new Error("Newsletter result contains an invalid article path");
            const portable = articlePath.split(path.sep).join("/");
            const normalized = path.posix.normalize(portable);
            if (normalized !== portable) throw new Error(`Newsletter article path is not normalized: ${articlePath}`);
            if (!normalized.startsWith("src/content/posts/zh-cn/") || !normalized.endsWith(".md")) throw new Error(`Unexpected newsletter article path: ${articlePath}`);
            if (!fs.existsSync(articlePath)) throw new Error(`Generated newsletter article is missing: ${articlePath}`);
          }
          fs.writeFileSync("newsletter-wechat-paths.txt", paths.join("\n"));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${paths.length}\n`);
          NODE

      - name: Validate planned drafts
        if: steps.paths.outputs.count != '0'
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
          WECHAT_PROXY_TOKEN: ${{ secrets.WECHAT_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t paths < newsletter-wechat-paths.txt
          pnpm run wechat publish "${paths[@]}" --dry-run --json | tee wechat-dry-run.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const results = JSON.parse(fs.readFileSync("wechat-dry-run.json", "utf8"));
          if (!Array.isArray(results) || results.some(item => item.status !== "planned" && !(item.status === "skipped" && item.skipReason === "already-synchronized"))) throw new Error(`Unexpected WeChat dry-run result: ${JSON.stringify(results)}`);
          NODE

      - name: Create drafts and retain partial ledger
        id: publish
        if: steps.paths.outputs.count != '0'
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
          WECHAT_PROXY_TOKEN: ${{ secrets.WECHAT_PROXY_TOKEN }}
        run: |
          set +e
          mapfile -t paths < newsletter-wechat-paths.txt
          pnpm run wechat publish "${paths[@]}" --json | tee wechat-results.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit WeChat ledger
        if: always() && steps.paths.outputs.count != '0'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- .astro-wechat/ledger.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .astro-wechat/ledger.json
          git commit -m "chore: update WeChat sync ledger [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Summarize newsletter WeChat sync
        if: always()
        env:
          UPSTREAM_WORKFLOW_RUN: ${{ inputs.upstream_workflow_run }}
          DRAFT_COUNT: ${{ steps.paths.outputs.count }}
        run: |
          {
            echo "### Newsletter WeChat synchronization"
            echo
            echo "- Upstream run: ${UPSTREAM_WORKFLOW_RUN}"
            echo "- Selected drafts: ${DRAFT_COUNT:-0}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WeChat results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newsletter-wechat-sync
          path: |
            newsletter-wechat-paths.txt
            wechat-dry-run.json
            wechat-results.json
          if-no-files-found: ignore

      - name: Fail after retaining partial ledger
        if: steps.publish.outputs.exit_code != '' && steps.publish.outputs.exit_code != '0'
        run: exit 1
