name: Publish Daily Digests

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Archive date in America/Los_Angeles, YYYY-MM-DD. Empty = today."
        required: false
        type: string
      force:
        description: "Overwrite an existing post for the same date"
        required: false
        type: boolean
        default: false
      ai_revision:
        description: "Admin AI configuration revision. Empty = latest; no model override."
        required: false
        type: string

jobs:
  publish:
    name: Publish daily digests
    permissions:
      contents: write
    uses: ./.github/workflows/blog-publish.yml
    with:
      task: tech-daily
      date: ${{ inputs.date || '' }}
      event_schedule: ${{ github.event.schedule || '30 0 * * *' }}
      force: ${{ inputs.force || false }}
      ai_revision: ${{ inputs.ai_revision || '' }}
      sync_wechat: false
    secrets: inherit
