name: Publish NYT Books Weekly

permissions:
  contents: write

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      date:
        description: "Archive date in Asia/Shanghai, YYYY-MM-DD. Empty = today."
        required: false
        type: string
      force:
        description: "Regenerate the post and create a replacement WeChat draft; the existing draft is retained."
        required: false
        type: boolean
        default: false
      ai_model:
        description: "Optional AI_MODEL override. Empty = repository secret/default."
        required: false
        type: string

jobs:
  publish:
    name: Publish NYT books weekly
    permissions:
      contents: write
    uses: ./.github/workflows/blog-publish.yml
    with:
      task: nyt-books-weekly
      date: ${{ inputs.date || '' }}
      event_schedule: ${{ github.event.schedule || '0 2 * * 0' }}
      force: ${{ inputs.force || false }}
      ai_model: ${{ inputs.ai_model || '' }}
      sync_wechat: true
    secrets: inherit
