name: Publish Newsletter Translations

permissions:
  contents: write

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      publication:
        description: "Registered publication key, or all."
        required: true
        default: all
        type: choice
        options:
          - all
          - curiosity-chronicle
          - after-babel
          - honest-broker
          - one-useful-thing
          - wheres-your-ed-at
          - roots-of-progress-institute
          - experimental-history
          - noahpinion
          - construction-physics
          - commoncog
          - intrinsic-perspective
          - astral-codex-ten
          - satpost
          - marginalian
      force:
        description: "Regenerate an item even when it is in the ledger."
        required: false
        default: false
        type: boolean
      backfill:
        description: "Inspect the latest N feed items; publication limits still apply."
        required: false
        type: string
      token_budget:
        description: "Per-publication token limit up to the fixed 400,000 ceiling."
        required: false
        default: "400000"
        type: string

concurrency:
  group: scheduled-posts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      generated_sha: ${{ steps.head.outputs.sha }}
      wechat_count: ${{ steps.wechat.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore validated article cache
        uses: actions/cache@v5
        with:
          path: .cache/substack-translations
          key: substack-translations-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'prompts/blog/substack-translation.md', 'scripts/substack_*.ts') }}-${{ github.run_id }}
          restore-keys: |
            substack-translations-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'prompts/blog/substack-translation.md', 'scripts/substack_*.ts') }}-

      - name: Generate translations
        id: generate
        env:
          INPUT_PUBLICATION: ${{ inputs.publication || 'all' }}
          INPUT_FORCE: ${{ inputs.force || false }}
          INPUT_BACKFILL: ${{ inputs.backfill || '' }}
          INPUT_TOKEN_BUDGET: ${{ inputs.token_budget || '400000' }}
          SUBSTACK_FETCH_PROXY_URL: ${{ secrets.REDDIT_SOURCE_API_URL }}
          SUBSTACK_FETCH_PROXY_TOKEN: ${{ secrets.REDDIT_SOURCE_API_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://rightapi.ai/gemini
          AI_MODEL: gemini-3.7-flash
          AI_API_STYLE: gemini
          # Disabled: the codex endpoint rejects the key with HTTP 401 (无效的API Key), so the
          # fallback only masked the primary error. Re-enable once AI_FALLBACK_API_KEY is valid.
          AI_FALLBACK_ENABLED: "false"
          AI_FALLBACK_API_KEY: ${{ secrets.AI_FALLBACK_API_KEY || secrets.AI_API_KEY }}
          AI_FALLBACK_BASE_URL: https://rightapi.ai/codex/v1
          AI_FALLBACK_MODEL: gpt-5.6-luna
          AI_FALLBACK_API_STYLE: chat
          # gemini-3.7-flash intermittently returns unparsable JSON: the same
          # Marginalian article failed twice and then published unchanged on the
          # third attempt. One retry covers that without doubling the token bill
          # on a genuinely broken item.
          AI_PRIMARY_RETRY_ATTEMPTS: "2"
          AI_COOLDOWN_RETRY_ATTEMPTS: "1"
          AI_TIMEOUT_MS: "900000"
        run: |
          set +e
          args=(--publication "$INPUT_PUBLICATION" --token-budget "$INPUT_TOKEN_BUDGET" --artifacts-dir substack-translation-artifacts --result-json substack-translation-result.json)
          if [ "$INPUT_FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$INPUT_BACKFILL" ]; then args+=(--backfill "$INPUT_BACKFILL"); fi
          node --import tsx scripts/generate_substack_translations.ts "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload generation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: substack-translation-generation
          path: |
            substack-translation-result.json
            substack-translation-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Count generated WeChat drafts
        id: wechat
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          let count = 0;
          if (fs.existsSync("substack-translation-result.json")) {
            const payload = JSON.parse(fs.readFileSync("substack-translation-result.json", "utf8"));
            count = (payload.results || []).filter(item => item.status === "published" && item.postPath && item.wechat?.enabled === true).length;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${count}\n`);
          NODE

      - name: Summarize generation
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const lines = ["### Newsletter translations", ""];
          if (!fs.existsSync("substack-translation-result.json")) {
            lines.push("No result JSON was produced.");
          } else {
            const payload = JSON.parse(fs.readFileSync("substack-translation-result.json", "utf8"));
            lines.push(`- Status: ${payload.status}`);
            lines.push(`- Charged tokens: ${payload.chargedTokens} (per-publication budget ${payload.publicationTokenBudget})`);
            lines.push("", "| Publication | Status | Tokens | Detail |", "| --- | --- | ---: | --- |");
            for (const item of payload.results || []) {
              const detail = String(item.reason || item.postPath || item.warning || "").replaceAll("|", "\\|").replaceAll("\n", " ");
              lines.push(`| ${item.publication} | ${item.status} | ${item.usage?.totalTokens || item.estimatedTokens || 0} | ${detail} |`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE

      - name: Format generated posts
        run: pnpm exec prettier --write "src/content/posts/zh-cn/*.md"

      - name: Verify newsletter content quality
        run: pnpm run check:conventions

      - name: Build site
        run: pnpm run build

      - name: Commit and push translations
        run: |
          set -euo pipefail
          paths=(src/content/posts/zh-cn data/substack-translations public/images/substack)
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for candidate in "${paths[@]}"; do
            if [ -e "$candidate" ]; then git add -- "$candidate"; fi
          done
          git commit -m "feat(posts): archive newsletter translations"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Record generated revision
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report generation failures
        if: always()
        env:
          GENERATION_EXIT_CODE: ${{ steps.generate.outputs.exit_code }}
        run: |
          if [ -z "$GENERATION_EXIT_CODE" ] || [ "$GENERATION_EXIT_CODE" != "0" ]; then
            echo "Newsletter generation reported one or more failures." >&2
            exit 1
          fi

  sync-newsletter-wechat:
    name: Sync opted-in newsletters to WeChat
    needs: translate
    if: ${{ always() && needs.translate.outputs.generated_sha != '' && needs.translate.outputs.wechat_count != '0' && vars.ENABLE_NEWSLETTER_WECHAT_SYNC == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/newsletter-wechat.yml
    with:
      upstream_sha: ${{ needs.translate.outputs.generated_sha }}
      upstream_workflow_run: ${{ github.run_id }}
    secrets: inherit
