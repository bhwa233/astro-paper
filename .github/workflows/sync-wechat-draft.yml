name: Sync Existing WeChat Draft

# 人工补推入口：校验路径后交给 wechat-sync.yml，同步逻辑不在这里。
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: "Repository-relative Markdown article path"
        required: true
        type: string
      force_create:
        description: "Create another draft when the article already has a committed sync record"
        required: true
        default: false
        type: boolean

jobs:
  validate:
    name: Validate article path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      path: ${{ steps.article.outputs.path }}
      is_reddit: ${{ steps.article.outputs.is_reddit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate article path
        id: article
        env:
          ARTICLE_PATH: ${{ inputs.article_path }}
        run: |
          set -euo pipefail
          test -f "$ARTICLE_PATH"
          normalized="$(realpath --relative-to="$GITHUB_WORKSPACE" "$ARTICLE_PATH")"
          case "$normalized" in
            src/content/posts/*.md) is_reddit=false ;;
            data/reddit-life-wechat/*.md|data/reddit-life-newspic/*.md) is_reddit=true ;;
            data/weibo-trending-wechat/*.md) is_reddit=false ;;
            *) echo "article_path must be a Markdown post under src/content/posts, data/reddit-life-wechat, data/reddit-life-newspic, or data/weibo-trending-wechat" >&2; exit 1 ;;
          esac
          printf 'path=%s\n' "$normalized" >> "$GITHUB_OUTPUT"
          printf 'is_reddit=%s\n' "$is_reddit" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync selected article to WeChat
    needs: validate
    if: ${{ needs.validate.outputs.is_reddit == 'true' || vars.ENABLE_MANUAL_NON_REDDIT_WECHAT_SYNC == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/wechat-sync.yml
    with:
      upstream_sha: ${{ github.sha }}
      article_paths: ${{ needs.validate.outputs.path }}
      force_create: ${{ inputs.force_create }}
      artifact_name: wechat-sync-results
      # 补推的语义是「我要一篇新草稿」：已同步而没传 force_create 时要明确失败，而不是静默跳过。
      require_created: true
    secrets: inherit
