name: Sync Existing WeChat Draft

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: "Repository-relative Markdown article path"
        required: true
        type: string
      force_create:
        description: "Create another draft when the article already has a committed sync record"
        required: true
        default: false
        type: boolean

jobs:
  sync:
    name: Sync selected article to WeChat
    runs-on: ubuntu-latest
    environment: wechat-production
    concurrency:
      group: wechat-sync-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: "Set up Node and pnpm"
        uses: ./.github/actions/setup

      - name: Validate article path
        id: article
        env:
          ARTICLE_PATH: ${{ inputs.article_path }}
        run: |
          set -euo pipefail
          test -f "$ARTICLE_PATH"
          normalized="$(realpath --relative-to="$GITHUB_WORKSPACE" "$ARTICLE_PATH")"
          case "$normalized" in
            src/content/posts/*.md) is_reddit=false ;;
            data/reddit-life-wechat/*.md|data/reddit-life-newspic/*.md) is_reddit=true ;;
            data/weibo-trending-wechat/*.md) is_reddit=false ;;
            *) echo "article_path must be a Markdown post under src/content/posts, data/reddit-life-wechat, data/reddit-life-newspic, or data/weibo-trending-wechat" >&2; exit 1 ;;
          esac
          printf 'path=%s\n' "$normalized" >> "$GITHUB_OUTPUT"
          printf 'is_reddit=%s\n' "$is_reddit" >> "$GITHUB_OUTPUT"

      - name: Create WeChat draft
        id: sync
        if: ${{ steps.article.outputs.is_reddit == 'true' || vars.ENABLE_MANUAL_NON_REDDIT_WECHAT_SYNC == 'true' }}
        env:
          ARTICLE_PATH: ${{ steps.article.outputs.path }}
          FORCE_CREATE: ${{ inputs.force_create }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
          WECHAT_PROXY_TOKEN: ${{ secrets.WECHAT_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ "$FORCE_CREATE" = "true" ]; then args+=(--force-create); fi
          pnpm run wechat publish "$ARTICLE_PATH" "${args[@]}" --json | tee wechat-results.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const results = JSON.parse(fs.readFileSync("wechat-results.json", "utf8"));
          if (!Array.isArray(results) || results.length !== 1 || results[0].status !== "created") {
            throw new Error(`Expected one created draft, got: ${JSON.stringify(results)}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "created=true\n");
          NODE

      - name: Commit WeChat ledger
        if: steps.sync.outputs.created == 'true'
        uses: ./.github/actions/archive-commit
        with:
          paths: .astro-wechat/ledger.json
          message: "chore: update WeChat sync ledger [skip ci]"

      - name: Upload synchronization result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wechat-sync-results
          path: wechat-results.json
          if-no-files-found: ignore
