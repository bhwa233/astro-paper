name: Sync Existing WeChat Draft

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: "Repository-relative Markdown article path"
        required: true
        type: string
      force_create:
        description: "Create another draft when the article already has a committed sync record"
        required: true
        default: false
        type: boolean

jobs:
  sync:
    name: Sync selected article to WeChat
    runs-on: ubuntu-latest
    environment: wechat-production
    concurrency:
      group: wechat-sync-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate article path
        id: article
        env:
          ARTICLE_PATH: ${{ inputs.article_path }}
        run: |
          set -euo pipefail
          case "$ARTICLE_PATH" in
            src/content/posts/*.md) ;;
            data/reddit-life-wechat/*.md) ;;
            data/weibo-trending-wechat/*.md) ;;
            *) echo "article_path must be a Markdown post under src/content/posts, data/reddit-life-wechat, or data/weibo-trending-wechat" >&2; exit 1 ;;
          esac
          test -f "$ARTICLE_PATH"
          printf 'path=%s\n' "$ARTICLE_PATH" >> "$GITHUB_OUTPUT"

      - name: Create WeChat draft
        id: sync
        env:
          ARTICLE_PATH: ${{ steps.article.outputs.path }}
          FORCE_CREATE: ${{ inputs.force_create }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
          WECHAT_PROXY_TOKEN: ${{ secrets.WECHAT_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ "$FORCE_CREATE" = "true" ]; then args+=(--force-create); fi
          pnpm run wechat publish "$ARTICLE_PATH" "${args[@]}" --json | tee wechat-results.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const results = JSON.parse(fs.readFileSync("wechat-results.json", "utf8"));
          if (!Array.isArray(results) || results.length !== 1 || results[0].status !== "created") {
            throw new Error(`Expected one created draft, got: ${JSON.stringify(results)}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "created=true\n");
          NODE

      - name: Commit WeChat ledger
        if: steps.sync.outputs.created == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .astro-wechat/ledger.json
          git commit -m "chore: update WeChat sync ledger [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "failed to push WeChat ledger" >&2
          exit 1

      - name: Upload synchronization result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wechat-sync-results
          path: wechat-results.json
          if-no-files-found: ignore
