name: Archive Weibo Trending WeChat Draft

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      date:
        description: "Archive date in Asia/Shanghai. Empty resolves to the previous day."
        required: false
        type: string
      upstream_sha:
        description: "Committed result from the weibo-trending parent workflow."
        required: true
        type: string
      upstream_workflow_run:
        description: "Workflow run that produced upstream_sha."
        required: true
        type: string
      force_rebuild:
        description: "Rebuild an existing archive and create a replacement WeChat draft."
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      date:
        description: "Archive date in Asia/Shanghai, YYYY-MM-DD. Empty = previous day."
        required: false
        type: string
      upstream_sha:
        description: "Commit that already contains the Weibo trending article."
        required: true
        type: string
      upstream_workflow_run:
        description: "Workflow run that produced the upstream article."
        required: true
        type: string
      force_rebuild:
        description: "Rebuild this date and create a replacement WeChat draft. The existing draft is retained."
        required: false
        default: false
        type: boolean

concurrency:
  group: weibo-trending-wechat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      generated_sha: ${{ steps.head.outputs.sha }}
      manifest_path: ${{ steps.generate.outputs.manifest_path }}
      generated_count: ${{ steps.generate.outputs.generated_count }}
      wechat_paths: ${{ steps.wechat-paths.outputs.paths }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.upstream_sha }}
          fetch-depth: 0
      - name: Prepare writable archive branch
        env:
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: git checkout -B "${GITHUB_REF_NAME}" "$UPSTREAM_SHA"
      - name: "Set up Node and pnpm"
        uses: ./.github/actions/setup
      - name: Resolve archive date
        id: archive-date
        env:
          INPUT_DATE: ${{ inputs.date || '' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          let date = process.env.INPUT_DATE;
          if (!date) {
            const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000);
            const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(yesterday);
            const get = type => parts.find(part => part.type === type)?.value;
            date = `${get("year")}-${get("month")}-${get("day")}`;
          }
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error(`Invalid archive date: ${date}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `date=${date}\n`);
          NODE
      - name: Generate Weibo trending WeChat archive
        id: generate
        env:
          ARCHIVE_DATE: ${{ steps.archive-date.outputs.date }}
          UPSTREAM_GENERATED_SHA: ${{ inputs.upstream_sha }}
          UPSTREAM_WORKFLOW_RUN: ${{ inputs.upstream_workflow_run }}
          INPUT_FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          set -euo pipefail
          args=(--date "$ARCHIVE_DATE" --upstream-sha "$UPSTREAM_GENERATED_SHA" --upstream-workflow-run "$UPSTREAM_WORKFLOW_RUN" --artifacts-dir weibo-trending-wechat-artifacts)
          if [ "$INPUT_FORCE_REBUILD" = "true" ]; then args+=(--force); fi
          node --import tsx scripts/generate_weibo_trending_wechat.ts "${args[@]}" | tee weibo-trending-wechat-result.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync("weibo-trending-wechat-result.json", "utf8"));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest_path=${result.manifestPath}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `generated_count=${(result.generatedPaths || []).length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `rendered=${result.rendered ? "true" : "false"}\n`);
          NODE
      # 供 sync-wechat 用：按 manifest 算出要发布的稿件路径，一行一个。
      - name: Collect WeChat draft paths
        id: wechat-paths
        if: steps.generate.outputs.manifest_path != ''
        env:
          MANIFEST_PATH: ${{ steps.generate.outputs.manifest_path }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, "utf8"));
          const paths = manifest.status === "processed" && manifest.draft?.path ? [manifest.draft.path] : [];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `paths<<PATHS\n${paths.join("\n")}\nPATHS\n`);
          NODE
      - name: Upload generation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weibo-trending-wechat-generation
          path: |
            weibo-trending-wechat-result.json
            weibo-trending-wechat-artifacts/
          if-no-files-found: ignore
      - name: Summarize generation
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const lines = ["### Weibo trending WeChat generation", ""];
          if (fs.existsSync("weibo-trending-wechat-result.json")) {
            const result = JSON.parse(fs.readFileSync("weibo-trending-wechat-result.json", "utf8"));
            lines.push(`- Archive date: ${result.date}`);
            lines.push(`- Status: ${result.status}`);
            lines.push(`- Manifest: \`${result.manifestPath}\``);
            lines.push(`- Generated files: ${(result.generatedPaths || []).length}`);
          } else {
            lines.push("- Generation did not produce a result JSON. Relevant diagnostics are in the uploaded artifact.");
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE
      # 卡片先上 Release 再提交 run.json：上传失败这一步就失败，不会出现「manifest 说有、Release 里没有」的提交。
      # 复用旧 manifest 的运行没有渲染，本地也没有卡片，跳过。资产契约见 scripts/release_assets.ts。
      - name: Publish card assets to release
        if: steps.generate.outputs.rendered == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ steps.generate.outputs.manifest_path }}
          ARCHIVE_DATE: ${{ steps.archive-date.outputs.date }}
        run: node --import tsx scripts/release_assets.ts upload --manifest "$MANIFEST_PATH" --title "微博热搜图片消息 $ARCHIVE_DATE" --notes "微信图片消息卡片，由 weibo-trending-wechat.yml 自动生成。归档日期 ${ARCHIVE_DATE}。"
      - name: Commit archive
        uses: ./.github/actions/archive-commit
        with:
          paths: data/weibo-trending-wechat
          message: "feat(weibo): archive trending WeChat draft"
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  sync-wechat:
    needs: generate-and-archive
    # 微博微信稿照常生成归档；仓库变量打开后才恢复推送。
    if: ${{ needs.generate-and-archive.outputs.generated_count != '0' && vars.ENABLE_WEIBO_TRENDING_WECHAT_SYNC == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/wechat-sync.yml
    with:
      upstream_sha: ${{ needs.generate-and-archive.outputs.generated_sha }}
      article_paths: ${{ needs.generate-and-archive.outputs.wechat_paths }}
      force_create: ${{ inputs.force_rebuild || false }}
      artifact_name: weibo-trending-wechat-sync
    secrets: inherit
