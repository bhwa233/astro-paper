name: Archive Weibo Trending WeChat Draft

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      date:
        description: "Archive date in Asia/Shanghai. Empty resolves to the previous day."
        required: false
        type: string
      upstream_sha:
        description: "Committed result from the weibo-trending parent workflow."
        required: true
        type: string
      upstream_workflow_run:
        description: "Workflow run that produced upstream_sha."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      date:
        description: "Archive date in Asia/Shanghai, YYYY-MM-DD. Empty = previous day."
        required: false
        type: string
      upstream_sha:
        description: "Commit that already contains the Weibo trending article."
        required: true
        type: string
      upstream_workflow_run:
        description: "Workflow run that produced the upstream article."
        required: true
        type: string

concurrency:
  group: scheduled-posts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      generated_sha: ${{ steps.head.outputs.sha }}
      manifest_path: ${{ steps.generate.outputs.manifest_path }}
      generated_count: ${{ steps.generate.outputs.generated_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.upstream_sha }}
          fetch-depth: 0
      - name: Prepare writable archive branch
        env:
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: git checkout -B "${GITHUB_REF_NAME}" "$UPSTREAM_SHA"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve archive date
        id: archive-date
        env:
          INPUT_DATE: ${{ inputs.date || '' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          let date = process.env.INPUT_DATE;
          if (!date) {
            const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000);
            const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(yesterday);
            const get = type => parts.find(part => part.type === type)?.value;
            date = `${get("year")}-${get("month")}-${get("day")}`;
          }
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error(`Invalid archive date: ${date}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `date=${date}\n`);
          NODE
      - name: Generate Weibo trending WeChat archive
        id: generate
        env:
          ARCHIVE_DATE: ${{ steps.archive-date.outputs.date }}
          UPSTREAM_GENERATED_SHA: ${{ inputs.upstream_sha }}
          UPSTREAM_WORKFLOW_RUN: ${{ inputs.upstream_workflow_run }}
        run: |
          set -euo pipefail
          node --import tsx scripts/generate_weibo_trending_wechat.ts \
            --date "$ARCHIVE_DATE" \
            --upstream-sha "$UPSTREAM_GENERATED_SHA" \
            --upstream-workflow-run "$UPSTREAM_WORKFLOW_RUN" \
            --artifacts-dir weibo-trending-wechat-artifacts | tee weibo-trending-wechat-result.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync("weibo-trending-wechat-result.json", "utf8"));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest_path=${result.manifestPath}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `generated_count=${(result.generatedPaths || []).length}\n`);
          NODE
      - name: Upload generation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weibo-trending-wechat-generation
          path: |
            weibo-trending-wechat-result.json
            weibo-trending-wechat-artifacts/
          if-no-files-found: ignore
      - name: Summarize generation
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const lines = ["### Weibo trending WeChat generation", ""];
          if (fs.existsSync("weibo-trending-wechat-result.json")) {
            const result = JSON.parse(fs.readFileSync("weibo-trending-wechat-result.json", "utf8"));
            lines.push(`- Archive date: ${result.date}`);
            lines.push(`- Status: ${result.status}`);
            lines.push(`- Manifest: \`${result.manifestPath}\``);
            lines.push(`- Generated files: ${(result.generatedPaths || []).length}`);
          } else {
            lines.push("- Generation did not produce a result JSON. Relevant diagnostics are in the uploaded artifact.");
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE
      - name: Commit archive
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/weibo-trending-wechat)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weibo-trending-wechat
          git commit -m "feat(weibo): archive trending WeChat draft"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  sync-wechat:
    needs: generate-and-archive
    if: needs.generate-and-archive.outputs.generated_count != '0'
    runs-on: ubuntu-latest
    environment: wechat-production
    concurrency:
      group: wechat-sync-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate-and-archive.outputs.generated_sha }}
          fetch-depth: 0
      - name: Prepare writable ledger branch
        env:
          GENERATED_SHA: ${{ needs.generate-and-archive.outputs.generated_sha }}
        run: git checkout -B "${GITHUB_REF_NAME}" "$GENERATED_SHA"
      - uses: actions/download-artifact@v8
        with:
          name: weibo-trending-wechat-generation
          path: .
      - uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect draft path and restore QR code
        id: paths
        env:
          MANIFEST_PATH: ${{ needs.generate-and-archive.outputs.manifest_path }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, "utf8"));
          const paths = manifest.status === "processed" && manifest.draft?.path ? [manifest.draft.path] : [];
          if (paths.length) {
            const qrSource = "weibo-trending-wechat-artifacts/qr.png";
            if (!fs.existsSync(qrSource)) throw new Error(`Missing QR artifact: ${qrSource}`);
            fs.copyFileSync(qrSource, path.join(path.dirname(paths[0]), "qr.png"));
          }
          fs.writeFileSync("weibo-trending-wechat-paths.txt", paths.join("\n"));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${paths.length}\n`);
          NODE
      - name: Validate planned draft
        if: steps.paths.outputs.count != '0'
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
          WECHAT_PROXY_TOKEN: ${{ secrets.WECHAT_PROXY_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t paths < weibo-trending-wechat-paths.txt
          pnpm exec astro-wechat publish "${paths[@]}" --dry-run --json | tee wechat-dry-run.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const results = JSON.parse(fs.readFileSync("wechat-dry-run.json", "utf8"));
          if (!Array.isArray(results) || results.some(item => item.status !== "planned" && !(item.status === "skipped" && item.skipReason === "already-synchronized"))) throw new Error(`Unexpected WeChat dry-run result: ${JSON.stringify(results)}`);
          NODE
      - name: Create draft and retain partial ledger
        if: steps.paths.outputs.count != '0'
        id: publish
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_PROXY_URL: ${{ secrets.WECHAT_PROXY_URL }}
          WECHAT_PROXY_TOKEN: ${{ secrets.WECHAT_PROXY_TOKEN }}
        run: |
          set +e
          mapfile -t paths < weibo-trending-wechat-paths.txt
          pnpm exec astro-wechat publish "${paths[@]}" --json | tee wechat-results.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit WeChat ledger
        if: always() && steps.paths.outputs.count != '0'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- .astro-wechat/ledger.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .astro-wechat/ledger.json
          git commit -m "chore: update WeChat sync ledger [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload WeChat results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weibo-trending-wechat-sync
          path: |
            wechat-dry-run.json
            wechat-results.json
          if-no-files-found: ignore
      - name: Fail after retaining partial ledger
        if: steps.publish.outputs.exit_code != '' && steps.publish.outputs.exit_code != '0'
        run: exit 1
